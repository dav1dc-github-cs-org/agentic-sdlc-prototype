name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: CI / Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=high
      - name: Verify the committed agent workflow
        run: |
          gh extension install github/gh-aw --pin v0.88.7
          gh aw compile sdlc-agent
          git diff --exit-code -- .github/workflows/sdlc-agent.lock.yml .github/aw
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: cat
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14
  codeql:
    name: CI / CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix control
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: source
          queries: security-extended
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
        with:
          output: ${{ runner.temp }}/sarif
          upload: false
      - name: Enforce the same findings policy as SDLC
        run: node control/src/validate.ts sarif "$RUNNER_TEMP/sarif"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: codeql
          path: ${{ runner.temp }}/sarif
          retention-days: 14